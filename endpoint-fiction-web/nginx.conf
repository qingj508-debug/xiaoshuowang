server {
    listen 80;
    server_name localhost;

    # CoreDNS 的 ClusterIP，配合变量方式让 nginx 在请求时动态解析
    resolver 10.96.0.10 valid=10s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        # 用变量 + FQDN，强制走 resolver 运行时解析，避免启动时短域名解析失败
        set $gateway endpoint-gateway-svc.endpoint.svc.cluster.local;
        proxy_pass http://$gateway:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

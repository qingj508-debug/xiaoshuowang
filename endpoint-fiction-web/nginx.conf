server {
    listen 80;
    server_name localhost;

    # CoreDNS 的 ClusterIP，配合变量方式让 nginx 在请求时动态解析
    resolver 10.96.0.10 valid=10s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        # glibc 底座 DNS 正常，用短域名 + resolver 动态解析
        set $gateway endpoint-gateway-svc;
        proxy_pass http://$gateway:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

apiVersion: v1
kind: ConfigMap
metadata:
  name: endpoint-config
  namespace: endpoint
data:
  # ===== Nacos =====
  NACOS_SERVER_ADDR: "nacos-service:8848"

  # ===== MySQL =====
  MYSQL_HOST: "mysql-service"
  MYSQL_PORT: "3306"
  MYSQL_USERNAME: "root"

  # ===== Redis =====
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

  # ===== RabbitMQ =====
  RABBITMQ_HOST: "rabbitmq-service"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VIRTUAL_HOST: "/"

  # ===== Elasticsearch =====
  ELASTICSEARCH_HOST: "elasticsearch-service"
  ELASTICSEARCH_PORT: "9200"
  ELASTICSEARCH_SCHEME: "http"

  # ===== OSS =====
  ALIYUN_OSS_BUCKET_NAME: "endpoint-oss1"

    -- ----------------------------
    -- Table structure for author_code
    -- ----------------------------
    DROP TABLE IF EXISTS `author_code`;
    CREATE TABLE `author_code`  (
      `id` bigint(0) NOT NULL AUTO_INCREMENT COMMENT '主键',

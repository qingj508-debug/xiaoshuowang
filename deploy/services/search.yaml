apiVersion: apps/v1
kind: Deployment
metadata:
  name: endpoint-search
  namespace: endpoint
spec:
  replicas: 1
  selector:
    matchLabels:
      app: endpoint-search
  template:
    metadata:
      labels:
        app: endpoint-search
    spec:
      containers:
        - name: search
          image: 192.168.10.102/xiaoshuowang/search:latest
          ports:
            - containerPort: 10005
          envFrom:
            - secretRef:
                name: endpoint-secrets
            - configMapRef:
                name: endpoint-config
---
apiVersion: v1
kind: Service
metadata:
  name: endpoint-search-svc
  namespace: endpoint
spec:
  selector:
    app: endpoint-search
  ports:
    - port: 10005
      targetPort: 10005

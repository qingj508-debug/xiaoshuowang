apiVersion: apps/v1
kind: Deployment
metadata:
  name: endpoint-home
  namespace: endpoint
spec:
  replicas: 1
  selector:
    matchLabels:
      app: endpoint-home
  template:
    metadata:
      labels:
        app: endpoint-home
    spec:
      containers:
        - name: home
          image: harbor.你的域名.com/endpoint-novel/home:latest
          ports:
            - containerPort: 10003
          envFrom:
            - configMapRef:
                name: endpoint-config
            - secretRef:
                name: endpoint-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: endpoint-home-svc
  namespace: endpoint
spec:
  selector:
    app: endpoint-home
  ports:
    - port: 10003
      targetPort: 10003

apiVersion: apps/v1
kind: Deployment
metadata:
  name: endpoint-home
  namespace: endpoint
spec:
  replicas: 1
  selector:
    matchLabels:
      app: endpoint-home
  template:
    metadata:
      labels:
        app: endpoint-home
    spec:
      initContainers:
        - name: wait-for-nacos
          image: 192.168.10.102/xiaoshuowang/busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until wget -q -O /dev/null http://nacos-service:8848/nacos/v1/console/health/readiness; do
                echo "waiting for nacos..."; sleep 3;
              done
      containers:
        - name: home
          image: 192.168.10.102/xiaoshuowang/home:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 10003
          envFrom:
            - secretRef:
                name: endpoint-secrets
            - configMapRef:
                name: endpoint-config
---
apiVersion: v1
kind: Service
metadata:
  name: endpoint-home-svc
  namespace: endpoint
spec:
  selector:
    app: endpoint-home
  ports:
    - port: 10003
      targetPort: 10003

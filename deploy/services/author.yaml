apiVersion: apps/v1
kind: Deployment
metadata:
  name: endpoint-author
  namespace: endpoint
spec:
  replicas: 1
  selector:
    matchLabels:
      app: endpoint-author
  template:
    metadata:
      labels:
        app: endpoint-author
    spec:
      initContainers:
        - name: wait-for-nacos
          image: 192.168.10.102/xiaoshuowang/busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until wget -q -O /dev/null http://nacos-service:8848/nacos/v1/console/health/readiness; do
                echo "waiting for nacos..."; sleep 3;
              done
      containers:
        - name: author
          image: 192.168.10.102/xiaoshuowang/author:cb2771fbe3a977bb83a39c63879d578f5f277982
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 10001
          envFrom:
            - secretRef:
                name: endpoint-secrets
            - configMapRef:
                name: endpoint-config
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: endpoint-author-svc
  namespace: endpoint
spec:
  selector:
    app: endpoint-author
  ports:
    - port: 10001
      targetPort: 10001

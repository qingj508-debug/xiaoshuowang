apiVersion: apps/v1
kind: Deployment
metadata:
  name: endpoint-gateway
  namespace: endpoint
spec:
  replicas: 1
  selector:
    matchLabels:
      app: endpoint-gateway
  template:
    metadata:
      labels:
        app: endpoint-gateway
    spec:
      containers:
        - name: gateway
          image: harbor.你的域名.com/endpoint-novel/gateway:latest
          ports:
            - containerPort: 8888
          envFrom:
            - secretRef:
                name: endpoint-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: endpoint-gateway-svc
  namespace: endpoint
spec:
  type: NodePort
  selector:
    app: endpoint-gateway
  ports:
    - port: 8888
      targetPort: 8888
      nodePort: 30888

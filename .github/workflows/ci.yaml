name: Build and Push to Harbor

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HARBOR_REGISTRY: 192.168.10.102
  HARBOR_PROJECT: xiaoshuowang
  HARBOR_USERNAME: admin
  HARBOR_PASSWORD: Harbor12345

jobs:
  # ===== 后端 7 个微服务（单 job 串行，不用 matrix） =====
  backend:
    runs-on:
      - self-hosted
      - linux
      - x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - name: Build Jars
        run: |
          docker run --rm \
            -v maven-repo:/root/.m2/repository \
            -v "$PWD/endpoint:/app" \
            -w /app \
            maven:3.8-eclipse-temurin-8 \
            sh -c 'mkdir -p /root/.m2; \
              echo "<settings><mirrors><mirror><id>aliyun</id><mirrorOf>*</mirrorOf><url>https://maven.aliyun.com/repository/public</url></mirror></mirrors></settings>" > /root/.m2/settings.xml; \
              MAVEN_ARGS="-Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryHandler.count=5 -Dmaven.wagon.httpconnectionManager.ttlSeconds=120 -Dhttps.protocols=TLSv1.2"; \
              for i in 1 2 3 4 5; do \
                mvn package -DskipTests -B -q $MAVEN_ARGS && break; \
                [ $i -eq 5 ] && exit 1; \
                echo "== attempt $i failed, retrying =="; sleep 5; \
              done'

      - name: Build and Push
        run: |
          SERVICES="gateway book author member home search third-party"
          for SERVICE in $SERVICES; do
            echo "===== Building $SERVICE ====="
            docker build \
              -t ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${SERVICE}:latest \
              -t ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${SERVICE}:${{ github.sha }} \
              --build-arg SERVICE_NAME=endpoint-${SERVICE} \
              -f ./endpoint/Dockerfile \
              ./endpoint
            docker push ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${SERVICE}:latest
            docker push ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${SERVICE}:${{ github.sha }}
            echo "===== $SERVICE done ====="
          done

  # ===== 前端 =====
  frontend:
    needs: backend
    runs-on:
      - self-hosted
      - linux
      - x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - name: Build and Push
        run: |
          docker build \
            -t ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:latest \
            -t ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:${{ github.sha }} \
            --build-arg VUE_APP_API_BASE_URL=/api \
            -f ./endpoint-fiction-web/Dockerfile \
            ./endpoint-fiction-web
          docker push ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:latest
          docker push ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:${{ github.sha }}

  # ===== 自动更新 deploy YAML 中的镜像标签 → ArgoCD 自动同步 =====
  update-deploy:
    needs: [backend, frontend]
    runs-on:
      - self-hosted
      - linux
      - x64
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update image tags in deploy YAML
        run: |
          SHA="${{ github.sha }}"

          # 7 个后端微服务（匹配任意旧 tag，首次是 :latest，之后是上一次的 sha）
          for svc in gateway book author member home search third-party; do
            yaml="deploy/services/${svc}.yaml"
            sed -i "s|image: .*/${svc}:.*|image: 192.168.10.102/xiaoshuowang/${svc}:${SHA}|g" "$yaml"
            echo "  ${yaml} -> ${svc}:${SHA}"
          done

          # 前端
          sed -i "s|image: .*/frontend:.*|image: 192.168.10.102/xiaoshuowang/frontend:${SHA}|g" deploy/frontend.yaml
          echo "  deploy/frontend.yaml -> frontend:${SHA}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/
          if git diff --cached --quiet; then
            echo "No changes, skipping commit."
          else
            # [skip ci] 防止 push 回 main 再次触发本 workflow 导致无限循环
            git commit -m "chore(deploy): bump images to ${{ github.sha }} [skip ci]"
            git push origin main
            echo "Pushed! ArgoCD will auto-sync."
          fi

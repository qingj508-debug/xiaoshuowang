name: Build and Push to Harbor

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HARBOR_REGISTRY: 192.168.10.102
  HARBOR_PROJECT: xiaoshuowang
  HARBOR_USERNAME: admin
  HARBOR_PASSWORD: Harbor12345

jobs:
  # ===== 后端 7 个微服务 =====
  backend:
    strategy:
      max-parallel: 1
      matrix:
        service:
          - gateway
          - book
          - author
          - member
          - home
          - search
          - third-party
    runs-on:
      - self-hosted
      - linux
      - x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - name: Build and Push
        run: |
          docker build \
            -t ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ matrix.service }}:latest \
            -t ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ matrix.service }}:${{ github.sha }} \
            --build-arg SERVICE_NAME=endpoint-${{ matrix.service }} \
            -f ./endpoint/Dockerfile \
            ./endpoint
          docker push ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ matrix.service }}:latest
          docker push ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ matrix.service }}:${{ github.sha }}

  # ===== 前端 =====
  frontend:
    needs: backend
    runs-on:
      - self-hosted
      - linux
      - x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - name: Build and Push
        run: |
          docker build \
            -t ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:latest \
            -t ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:${{ github.sha }} \
            --build-arg VUE_APP_API_BASE_URL=http://192.168.10.200/api \
            -f ./endpoint-fiction-web/Dockerfile \
            ./endpoint-fiction-web
          docker push ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:latest
          docker push ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:${{ github.sha }}

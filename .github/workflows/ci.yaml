name: Build and Push to Harbor

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HARBOR_REGISTRY: 192.168.10.102
  HARBOR_PROJECT: xiaoshuowang
  HARBOR_USERNAME: admin
  HARBOR_PASSWORD: Harbor12345
  DOCKER_BUILDKIT: "1"

jobs:
  # ===== 后端 7 个微服务（单 job 串行，不用 matrix） =====
  backend:
    runs-on:
      - self-hosted
      - linux
      - x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build and Push
        run: |
          SERVICES="gateway book author member home search third-party"
          for SERVICE in $SERVICES; do
            echo "===== Building $SERVICE ====="
            docker build \
              -t ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${SERVICE}:latest \
              -t ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${SERVICE}:${{ github.sha }} \
              --build-arg SERVICE_NAME=endpoint-${SERVICE} \
              --build-arg http_proxy \
              --build-arg https_proxy \
              --build-arg no_proxy=maven.aliyun.com,localhost,127.0.0.1,192.168.10.102 \
              -f ./endpoint/Dockerfile \
              ./endpoint
            docker push ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${SERVICE}:latest
            docker push ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${SERVICE}:${{ github.sha }}
            echo "===== $SERVICE done ====="
          done

  # ===== 前端 =====
  frontend:
    needs: backend
    runs-on:
      - self-hosted
      - linux
      - x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build and Push
        run: |
          docker build \
            -t ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:latest \
            -t ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:${{ github.sha }} \
            --build-arg VUE_APP_API_BASE_URL=http://192.168.10.200/api \
            --build-arg http_proxy \
            --build-arg https_proxy \
            --build-arg no_proxy=registry.npmmirror.com,localhost,127.0.0.1,192.168.10.102 \
            -f ./endpoint-fiction-web/Dockerfile \
            ./endpoint-fiction-web
          docker push ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:latest
          docker push ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:${{ github.sha }}

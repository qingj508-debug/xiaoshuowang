name: Build and Push to Harbor

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HARBOR_REGISTRY: hadoop102
  HARBOR_PROJECT: endpoint-novel
  HARBOR_USERNAME: admin
  HARBOR_PASSWORD: Harbor12345

jobs:
  # ===== 后端 7 个微服务 =====
  backend:
    strategy:
      max-parallel: 1
      matrix:
        service:
          - gateway
          - book
          - author
          - member
          - home
          - search
          - third-party
    runs-on:
      - self-hosted
      - linux
      - x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./endpoint
          file: ./endpoint/Dockerfile
          build-args: |
            SERVICE_NAME=endpoint-${{ matrix.service }}
          push: true
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ matrix.service }}:latest
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ matrix.service }}:${{ github.sha }}

  # ===== 前端 =====
  frontend:
    runs-on:
      - self-hosted
      - linux
      - x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./endpoint-fiction-web
          file: ./endpoint-fiction-web/Dockerfile
          build-args: |
            VUE_APP_API_BASE_URL=http://192.168.10.200/api
          push: true
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:latest
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:${{ github.sha }}
